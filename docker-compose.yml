services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusdb
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/campusdb
      DB_USERNAME: campus
      DB_PASSWORD: campus_password
      JWT_SECRET: ChangeThisSecretKeyToSomethingLongRandomAndSecure2024!
      AWS_REGION: ap-south-1
      S3_BUCKET: campus-recruitment-resumes
      DYNAMODB_TABLE: application-status-history
      # Pass real AWS creds through, or point at LocalStack via S3_ENDPOINT/DYNAMODB_ENDPOINT
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

volumes:
  postgres_data:
