# Activate with: SPRING_PROFILES_ACTIVE=prod
# All values below are expected to come from environment variables in the
# deployment environment (Docker/EC2) - nothing sensitive is hardcoded here.

spring:
  datasource:
    url: ${DB_URL}          # e.g. jdbc:postgresql://<host>:5432/campusdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate    # in prod, schema changes go through migrations, not auto-DDL
    show-sql: false

  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}     # must be set; no fallback in prod

aws:
  region: ${AWS_REGION}
  s3:
    bucket: ${S3_BUCKET}
    endpoint: ${S3_ENDPOINT:}
  dynamodb:
    table-name: ${DYNAMODB_TABLE}
    endpoint: ${DYNAMODB_ENDPOINT:}
